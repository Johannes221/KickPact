services:
  postgres-test:
    image: postgres:16-alpine
    container_name: kickpact-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kickpact_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d kickpact_test"]
      interval: 2s
      timeout: 5s
      retries: 10
