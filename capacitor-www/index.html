<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KickPact</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0B1F17; color: #E9F5EE;
        font-family: -apple-system, system-ui, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1rem; text-align: center; padding: 2rem; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: #22C55E;
        animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <!--
      Fallback-Shell. Wird im Normalbetrieb NICHT angezeigt — Capacitor lädt via
      server.url die Live-Web-App. Diese Seite erscheint nur, falls die Remote-URL
      (noch) nicht erreichbar ist (z.B. kein Netz beim Kaltstart).
    -->
    <div class="wrap">
      <div class="dot"></div>
      <p>KickPact wird geladen …</p>
    </div>
  </body>
</html>
