name: CI

# NUR bei Pull Requests (2026-07-19, Actions-Budget). Ein Lauf auf `push: main`
# käme zu spät — da ist der Code bereits gemerged, das Gate kann nichts mehr
# verhindern. Der PR-Lauf ist der Zeitpunkt, an dem das Ergebnis noch zählt.
# Zusammen mit dem concurrency-Block und dem entfernten Playwright-Install
# ungefähr halber Verbrauch gegenüber vorher, bei vollem Schutz vor dem Merge.
on:
  pull_request:

# Neuer Push auf denselben Branch bricht den noch laufenden Run ab —
# ohne das läuft pro PR-Push ein weiterer Run parallel mit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kickpact_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run unit + integration tests
        # Echtes Gate, KEIN continue-on-error mehr (2026-07-19).
        #
        # Der alte Kommentar hier veranschlagte für die 69 Failures aus 13
        # Files einen „~3-4h Proper-Fix-Plan" (Test-DB-Pollution, fehlende
        # Migrations, Parser-Fixtures, RESEND_API_KEY). Nachgemessen am
        # 19.07. mit exakt diesem Befehl: davon war nur noch EINE Ursache
        # übrig — der fehlende RESEND_API_KEY riss über lib/mail/client.ts
        # acht Test-Files beim Modul-Load mit. Die anderen drei hatten sich
        # zwischenzeitlich von selbst erledigt (Slot-DB-Umbau vom 17.07. für
        # 1+2, committete Fixtures für 4).
        #
        # Beleg: ohne die zwei Variablen 8 Files rot / 1796 Tests grün,
        # mit ihnen 240 Files grün / 1890 Tests grün.
        #
        # Die Werte sind bewusst Dummies: kein Test verschickt echte Mail,
        # die Module prüfen beim Import nur auf Anwesenheit.
        run: npm run test:ci
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:54329/kickpact_test
          RESEND_API_KEY: re_dummy_ci_no_mail_is_sent
          MAIL_FROM: "KickPact CI <noreply@example.invalid>"

  e2e:
    # Temporär deaktiviert: die E2E-Specs (tests/e2e/01-onboarding.spec.ts,
    # onboarding-flows.spec.ts, scraper-flow/verein-onboarding.spec.ts)
    # referenzieren noch den alten 5-Step Wizard unter /onboarding/verein/1..5.
    # Der neue 3-Step Wizard liegt unter /onboarding/{mannschaft|verein}/{verein|stammdaten|sponsoren}.
    # Re-Aktivieren sobald die Specs umgeschrieben sind (Tracked in STATE.md
    # unter "Was morgen ansteht / Priorität 3").
    if: false
    runs-on: ubuntu-latest
    needs: unit-integration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kickpact_e2e
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://test:test@localhost:54329/kickpact_e2e
